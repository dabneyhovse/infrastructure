services:

  db:
    container_name: ${POSTGRES_CONTAINER_NAME}
    image: postgres:16.6-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - socialpredict_internal_network
    env_file:
      - .env

  backend:
    container_name: "${BACKEND_CONTAINER_NAME}"
    image: "${BACKEND_IMAGE_NAME}"
    restart: unless-stopped
    networks:
      - socialpredict_internal_network
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    container_name: "${FRONTEND_CONTAINER_NAME}"
    image: "${FRONTEND_IMAGE_NAME}"
    restart: unless-stopped
    networks:
      - socialpredict_internal_network
    env_file:
      - .env
    depends_on:
      - backend

  webserver:
    container_name: "${NGINX_CONTAINER_NAME}"
    image: nginx:latest
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${APP_ENV}
      DOMAIN: ${DOMAIN}
    volumes:
      - ./data/nginx/vhosts/prod:/etc/nginx/templates/
    networks:
      - socialpredict_internal_network
      - traefik
    env_file:
      - .env
    depends_on:
      - backend
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.social-predict.entrypoints=web,websecure"
      - "traefik.http.routers.social-predict.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.social-predict.loadbalancer.server.url=http://${NGINX_CONTAINER_NAME}"

networks:
  socialpredict_internal_network:
  traefik:
    external: true
